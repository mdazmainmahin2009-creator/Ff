<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Dashboard - Firebase Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0b21;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(106, 17, 203, 0.2);
            border-radius: 50%;
            top: 20%;
            left: 20%;
            filter: blur(80px);
            z-index: 0;
        }

        .login-container {
            background: rgba(20, 18, 38, 0.7);
            border: 2px solid rgba(106, 85, 237, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 1;
        }

        .login-container h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #bfa6ff;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #a3a1b8;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 15px;
            color: #6a55ed;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(13, 11, 33, 0.8);
            border: 1px solid rgba(106, 85, 237, 0.4);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: #8c7ae6;
            box-shadow: 0 0 10px rgba(106, 85, 237, 0.5);
            background: rgba(20, 18, 38, 0.9);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #67657e;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #bfa6ff;
        }

        .btn-sign-in {
            width: 100%;
            padding: 14px;
            background: #6a55ed;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(106, 85, 237, 0.4);
        }

        .btn-sign-in:hover {
            background: #563fd1;
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff4a5a;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .success-message {
            color: #2ed573;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 13px;
            color: #55536d;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Key Dashboard</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fa-solid fa-eye toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <button type="submit" class="btn-sign-in" id="submitBtn">
                Sign In <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="error-message" id="errorMsg"></div>
        <div class="success-message" id="successMsg">Login successful! Redirecting...</div>

        <div class="footer-text">
            Dashboard 2026
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ আপনার Firebase প্রজেক্টের সঠিক ক্রেডেনশিয়াল এখানে বসান
        const firebaseConfig = {
  apiKey: "AIzaSyC07_OkndlAPYakg6LSy7Sc5l74t48Gzlc",
  authDomain: "tempmastercard.xo.je",
  projectId: "azmain-e520c",
  storageBucket: "azmain-e520c.firebasestorage.app",
  messagingSenderId: "698493605242",
  appId: "1:698493605242:web:e1e2551e749171267fb2c3",
  measurementId: "G-3J0CBW5ESE"
};

        // Firebase ইনিশিয়ালাইজ করা
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ফর্ম সাবমিট হ্যান্ডলার
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const submitBtn = document.getElementById('submitBtn');

            // রিসেট মেসেজ ও বাটন ডিজেবল
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.innerText = "Checking...";
            submitBtn.disabled = true;

            // Firebase দিয়ে লগইন চেক
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // সফল লগইন
                    successMsg.style.display = 'block';
                    submitBtn.innerText = "Success";
                    
                    // সফল লগইনের পর ইউজারকে ড্যাশবোর্ডে রিডাইরেক্ট করুন (যেমন: dashboard.html)
                    setTimeout(() => {
                        window.location.href = "dashboard.html"; 
                    }, 1500);
                })
                .catch((error) => {
                    // ব্যর্থ লগইন (ভুল ইমেইল/পাসওয়ার্ড বা অ্যাডমিন তৈরি করেনি এমন অ্যাকাউন্ট)
                    submitBtn.innerText = "Sign In";
                    submitBtn.disabled = false;
                    errorMsg.style.display = 'block';
                    
                    if(error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                        errorMsg.innerText = "Invalid Email or Password!";
                    } else {
                        errorMsg.innerText = "Error: " + error.message;
                    }
                });
        });
    </script>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
  </html>
